# Reusable DeepSeek code review for the repositories of this organization.
#
# Call it from a repository that should be reviewed:
#
#   jobs:
#     code-review:
#       uses: CodeEffect-GmbH/.github/.github/workflows/deepseek-review.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#       secrets:
#         deepseek-api-key: ${{ secrets.<your DeepSeek token secret> }}
#
# The reviewed repository only has to provide its review policy, by default
# `.github/deepseek-review.md` (see the `deepseek-review` action in this repository).
# Everything else - diff handling, line validation, review submission - is generic.
#
# Call it from a `pull_request_target` trigger of the calling repository: the event
# type is what makes the number available and what keeps pull request code from
# running with a write token.

name: DeepSeek Code Review

on:
  workflow_call:
    inputs:
      model:
        description: DeepSeek model name.
        type: string
        default: deepseek-v4-flash
      base-url:
        description: DeepSeek API base URL.
        type: string
        default: https://api.deepseek.com
      thinking:
        description: Reasoning mode, `enabled` or `disabled`.
        type: string
        default: enabled
      event:
        description: Review event when the diff has findings.
        type: string
        default: REQUEST_CHANGES
      include-patterns:
        description: Comma separated globs the review is restricted to.
        type: string
        default: ''
      exclude-patterns:
        description: Comma separated globs that are never reviewed.
        type: string
        default: package-lock.json,**/package-lock.json,*.lock,**/*.lock
      policy-file:
        description: Repository relative path of the review policy file.
        type: string
        default: .github/deepseek-review.md
      policy-fallback-files:
        description: Comma separated files read when the policy file is missing.
        type: string
        default: AGENTS.md,.github/copilot-instructions.md
      node-version:
        description: Node.js version used to run the review.
        type: string
        default: '22'
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 30
      mention:
        description: >-
          Text that requests a new review when it appears in a pull request comment.
          Only used when the caller also listens to `issue_comment`.
        type: string
        default: '@deepseek-review'
      pr-number:
        description: >-
          Pull request to review. Empty uses the pull request of the triggering
          event, which covers both pull request events and `issue_comment`.
        type: string
        default: ''
    secrets:
      deepseek-api-key:
        description: DeepSeek API token used for the review request.
        required: true

# A called workflow can only reduce the permissions of its caller.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Code Review
    # An automatic run reviews opened/reopened/updated pull requests but skips drafts;
    # drafts are reviewed when they are marked ready for review. A comment that asks
    # for a review reviews drafts too, but only for members, owners and collaborators
    # of the repository.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, inputs.mention) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # No checkout: the diff and the review policy are read through the API, so pull
    # request code never reaches the runner and comment triggered runs work without
    # resolving a base ref.
    steps:
      - name: DeepSeek review
        uses: CodeEffect-GmbH/.github/deepseek-review@main
        with:
          deepseek-api-key: ${{ secrets.deepseek-api-key }}
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number || github.event.issue.number }}
          model: ${{ inputs.model }}
          base-url: ${{ inputs.base-url }}
          thinking: ${{ inputs.thinking }}
          event: ${{ inputs.event }}
          include-patterns: ${{ inputs.include-patterns }}
          exclude-patterns: ${{ inputs.exclude-patterns }}
          policy-file: ${{ inputs.policy-file }}
          policy-fallback-files: ${{ inputs.policy-fallback-files }}
          node-version: ${{ inputs.node-version }}
